<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>María-Teresa Carmier</title>
    <link rel="icon" type="image/png" href="assets/favicon1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="story-style.css">
</head>
<body>
    <div class="story-container">
        <!-- Fixed Header -->
        <header class="fixed-header">
            <h1 class="site-name">María-Teresa Carmier</h1>
            <a href="about.html" class="about-btn">About</a>
        </header>

        <!-- Three Column Grid -->
        <div class="column-grid" id="columnGrid">
            <!-- Column 1 -->
            <div class="story-column" data-project="0">
                <div class="story-progress">
                    <div class="progress-bar active"></div>
                    <div class="progress-bar"></div>
                    <div class="progress-bar"></div>
                    <div class="progress-bar"></div>
                </div>
                <div class="story-content"></div>
                <div class="story-nav">
                    <button class="nav-prev">←</button>
                    <button class="nav-next">→</button>
                </div>
            </div>

            <!-- Column 2 -->
            <div class="story-column" data-project="1">
                <div class="story-progress">
                    <div class="progress-bar active"></div>
                    <div class="progress-bar"></div>
                    <div class="progress-bar"></div>
                    <div class="progress-bar"></div>
                </div>
                <div class="story-content"></div>
                <div class="story-nav">
                    <button class="nav-prev">←</button>
                    <button class="nav-next">→</button>
                </div>
            </div>

            <!-- Column 3 -->
            <div class="story-column" data-project="2">
                <div class="story-progress">
                    <div class="progress-bar active"></div>
                    <div class="progress-bar"></div>
                    <div class="progress-bar"></div>
                    <div class="progress-bar"></div>
                </div>
                <div class="story-content"></div>
                <div class="story-nav">
                    <button class="nav-prev">←</button>
                    <button class="nav-next">→</button>
                </div>
            </div>
        </div>

        <!-- Cycle Indicators -->
        <div class="cycle-indicators">
            <button class="cycle-btn active" data-cycle="0">1-3</button>
            <button class="cycle-btn" data-cycle="1">4-6</button>
        </div>
    </div>

    <script src="story-script.js"></script>
</body>
</html>
